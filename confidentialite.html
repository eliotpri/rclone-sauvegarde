<h1>Règles de confidentialité</h1>
<p>Cette application est à usage strictement personnel. Elle accède en lecture seule aux fichiers Google Drive de son propriétaire, pour les copier sur son propre ordinateur. Aucune donnée n'est collectée, stockée sur un serveur tiers, partagée ou vendue.</p>
